apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homelab.common.names.fullname" . }}
  labels:
    {{- include "homelab.common.labels.standard" (dict "context" . "customLabels" .Values.customLabels "component" .Values.component) | nindent 4 }}
data:
  name: {{ include "homelab.common.names.name" . | quote }}
  selector: {{ include "homelab.common.labels.selector" (dict "context" . "component" .Values.component) | quote }}
  image: {{ include "homelab.common.images.image" (dict "imageRoot" .Values.image "global" .Values.global "chart" .Chart) | quote }}
  secrets: {{ include "homelab.common.images.pullSecrets" (dict "global" .Values.global "pullSecrets" .Values.imagePullSecrets "images" (list .Values.image)) | quote }}
  storage: {{ include "homelab.common.storage.class" (dict "persistence" .Values.persistence "global" .Values.global) | quote }}
  claim: {{ include "homelab.common.storage.claimName" (dict "persistence" .Values.persistence "defaultName" (printf "%s-data" (include "homelab.common.names.fullname" .))) | quote }}
  account: {{ include "homelab.common.serviceAccount.name" (dict "context" . "serviceAccount" .Values.serviceAccount) | quote }}
  rendered: {{ include "homelab.common.tplvalues.render" (dict "value" (default "{{ .Release.Name }}" .Values.renderValue) "context" . "scope" .Values.renderScope) | quote }}
  merged: {{ include "homelab.common.tplvalues.merge" (dict "values" .Values.mergeValues "context" .) | quote }}
