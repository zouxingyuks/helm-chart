# 默认安装单集群监控、日志采集及应用三信号后端。
global:
  grafana:
    install: true
  prometheus:
    install: true
    url: ""
    datasourceUid: prometheus
  loki:
    install: true
    url: ""

grafanaDatasources:
  # 数据源 ConfigMap 部署在 release namespace。
  enabled: true
  labels:
    grafana_datasource: "1"
  # Grafana 数据源 UID。
  tempoUid: tracing-tempo
  lokiUid: tracing-loki

grafana:
  grafana.ini:
    plugins:
      preinstall_disabled: true
      preinstall_auto_update: false
  initChownData:
    securityContext:
      capabilities:
        add:
          - CHOWN
          - DAC_READ_SEARCH
  image:
    tag: "13.0.1"
  persistence:
    enabled: true
    size: 10Gi
    annotations:
      helm.sh/resource-policy: keep
  deploymentStrategy:
    type: Recreate
  rbac:
    namespaced: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      label: tracing_stack_datasource
      labelValue: '{{ .Release.Name }}'
      resource: configmap
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  testFramework:
    enabled: false

monitoring:
  grafana:
    enabled: false
    forceDeployDashboards: true
  commonLabels:
    observability_stack: tracing
  kube-state-metrics:
    prometheus:
      monitor:
        additionalLabels:
          observability_stack: tracing
  prometheus-node-exporter:
    prometheus:
      monitor:
        additionalLabels:
          observability_stack: tracing
  prometheusOperator:
    prometheusInstanceSelector: observability_stack=tracing
    alertmanagerInstanceSelector: observability_stack=tracing
  prometheus:
    prometheusSpec:
      enableRemoteWriteReceiver: true
      enableFeatures: [exemplar-storage]
      retention: 15d
      retentionSize: 40GB
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels: {observability_stack: tracing}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector:
        matchLabels: {observability_stack: tracing}
      podMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleSelector:
        matchLabels: {observability_stack: tracing}
      ruleNamespaceSelector: {}
      probeSelectorNilUsesHelmValues: false
      probeSelector:
        matchLabels: {observability_stack: tracing}
      scrapeConfigSelectorNilUsesHelmValues: false
      scrapeConfigSelector:
        matchLabels: {observability_stack: tracing}
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 50Gi
  alertmanager:
    enabled: true
    alertmanagerSpec:
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi

tempo:
  replicas: 1
  tempo:
    tag: "2.9.0"
    reportingEnabled: false
    retention: 72h
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
  persistence:
    enabled: true
    size: 10Gi
    enableStatefulSetAutoDeletePVC: false
  # 显式开启三个处理器，单独 enabled 并不激活 span/service-graph 计算。
  config: |
    memberlist:
      cluster_label: {{ printf "%s.%s" .Release.Name .Release.Namespace | quote }}
    multitenancy_enabled: false
    usage_report:
      reporting_enabled: {{ .Values.tempo.reportingEnabled }}
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester: {}
    querier: {}
    query_frontend: {}
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention }}
    storage:
      {{- toYaml .Values.tempo.storage | nindent 2 }}
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics, local-blocks]
    metrics_generator:
      processor:
        service_graphs: {}
        span_metrics: {}
        local_blocks:
          flush_to_storage: true
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: {{ printf "%s/api/v1/write" (include "tracing-stack.prometheusURL" .) | quote }}
            send_exemplars: true
      traces_storage:
        path: /var/tempo/generator/traces

gateway:
  mode: statefulset
  podSecurityContext:
    fsGroup: 10001
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
  statefulset:
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenDeleted: Retain
      whenScaled: Retain
    volumeClaimTemplates:
      - metadata:
          name: queue
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
  extraVolumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol
  replicaCount: 1
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: "0.145.0"
  command:
    name: otelcol-contrib
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  alternateConfig:
    extensions:
      file_storage:
        directory: /var/lib/otelcol
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], attributes["service_name"]) where resource.attributes["service.name"] == nil and attributes["service_name"] != nil
              - set(resource.attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
              - set(resource.attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
              - set(resource.attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil
              - merge_maps(cache, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\s*\\{")
              - set(trace_id.string, cache["trace_id"]) where IsString(cache["trace_id"]) and IsMatch(cache["trace_id"], "^[0-9a-fA-F]{32}$")
              - set(span_id.string, cache["span_id"]) where IsString(cache["span_id"]) and IsMatch(cache["span_id"], "^[0-9a-fA-F]{16}$")
              - set(resource.attributes["service.name"], cache["service_name"]) where IsString(cache["service_name"])
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        timeout: 5s
    exporters:
      otlp/tempo:
        endpoint: '{{ include "tracing-stack.backendName" (dict "Release" .Release "name" "tempo") }}:4317'
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 1000
          storage: file_storage
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
      otlphttp/loki:
        endpoint: '{{ include "tracing-stack.lokiURL" . }}/otlp'
        sending_queue:
          enabled: true
          queue_size: 1000
          storage: file_storage
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
      prometheusremotewrite:
        wal:
          directory: /var/lib/otelcol/prometheus
          buffer_size: 100
          truncate_frequency: 1m
        remote_write_queue:
          enabled: true
          queue_size: 1000
        endpoint: '{{ include "tracing-stack.prometheusURL" . }}/api/v1/write'
        resource_to_telemetry_conversion:
          enabled: true
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/logs, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
  ports:
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

# 完整安装使用独立 Loki。复用模式需显式指定 global.loki.url。
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      retention_period: 168h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      enableStatefulSetAutoDeletePVC: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  sidecar:
    rules:
      enabled: false
  test:
    enabled: false
  minio:
    enabled: false

alloy:
  configReloader:
    image:
      tag: v0.91.0
  enabled: true
  excludedNamespaces: []
  excludedWorkloads: []
  crds:
    create: false
  controller:
    type: statefulset
    replicas: 1
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
  alloy:
    stabilityLevel: public-preview
    enableReporting: false
    storagePath: /var/lib/alloy
    mounts:
      extra:
        - name: data
          mountPath: /var/lib/alloy
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }
        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_phase"]
            regex = "Succeeded|Failed"
            action = "drop"
          }
          {{- range .Values.excludedNamespaces }}
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            regex = {{ . | quote }}
            action = "drop"
          }
          {{- end }}
          {{- range .Values.excludedWorkloads }}
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            separator = "/"
            regex = {{ . | quote }}
            action = "drop"
          }
          {{- end }}
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label = "service_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator = "/"
            target_label = "job"
          }
        }
        loki.source.kubernetes "pods" {
          targets = discovery.relabel.pods.output
          forward_to = [otelcol.receiver.loki.pods.receiver]
        }
        otelcol.receiver.loki "pods" {
          output {
            logs = [otelcol.exporter.otlphttp.gateway.input]
          }
        }
        otelcol.storage.file "queue" {
          directory = "/var/lib/alloy/queue"
        }
        otelcol.exporter.otlphttp "gateway" {
          client {
            endpoint = "http://{{ include "tracing-stack.backendName" (dict "Release" .Release "name" "gateway") }}:4318"
          }
          sending_queue {
            enabled = true
            queue_size = 1000
            storage = otelcol.storage.file.queue.handler
          }
          retry_on_failure {
            enabled = true
            max_elapsed_time = "0s"
          }
        }

# 可选外部接入层；认证成功后同步转发到持久化 Gateway。
otlp-edge:
  enabled: false
  mode: deployment
  replicaCount: 1
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: "0.145.0"
  command:
    name: otelcol-contrib
  extraEnvs:
    - name: OTLP_TOKEN
      valueFrom:
        secretKeyRef:
          name: ""
          key: token
  alternateConfig:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      bearertokenauth:
        scheme: Bearer
        token: ${env:OTLP_TOKEN}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            auth:
              authenticator: bearertokenauth
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: bearertokenauth
    exporters:
      otlphttp:
        endpoint: 'http://{{ include "tracing-stack.backendName" (dict "Release" .Release "name" "gateway") }}:4318'
        sending_queue:
          enabled: false
        retry_on_failure:
          enabled: false
    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlphttp]
        logs:
          receivers: [otlp]
          exporters: [otlphttp]
        metrics:
          receivers: [otlp]
          exporters: [otlphttp]
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

thanos:
  enabled: false
  image:
    repository: quay.io/thanos/thanos
    tag: v0.39.2
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  existingObjstoreSecret: ""
  objstoreKey: objstore.yml
  persistence:
    storageClass: ""
    storeSize: 10Gi
    compactorSize: 20Gi
  retention:
    raw: 30d
    fiveMinutes: 90d
    oneHour: 180d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

notifications:
  configured: false
