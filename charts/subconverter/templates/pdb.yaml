{{- if and .Values.backend.enabled .Values.backend.podDisruptionBudget.enabled }}
{{- if and .Values.backend.podDisruptionBudget.minAvailable .Values.backend.podDisruptionBudget.maxUnavailable }}
{{- fail "backend.podDisruptionBudget.minAvailable and backend.podDisruptionBudget.maxUnavailable are mutually exclusive. Only one can be set at a time." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "subconverter.backend.fullname" . }}
  labels:
    {{- include "subconverter.backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "subconverter.backend.selectorLabels" . | nindent 6 }}
  {{- if .Values.backend.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.backend.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.backend.podDisruptionBudget.maxUnavailable }}
  {{- end }}
{{- end }}
