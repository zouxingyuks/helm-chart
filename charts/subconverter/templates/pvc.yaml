{{- if and .Values.backend.enabled .Values.backend.persistence.enabled (not .Values.backend.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "subconverter.backend.claimName" . | quote }}
  labels:
    {{- include "subconverter.backend.labels" . | nindent 4 }}
  {{- with .Values.backend.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.backend.persistence.accessModes | nindent 4 }}
  {{- include "homelab.common.storage.class" (dict "persistence" .Values.backend.persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size }}
{{- end }}
