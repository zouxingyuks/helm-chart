---
# Backend Service
{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "subconverter.backend.fullname" . }}
  labels:
    {{- include "subconverter.backend.labels" . | nindent 4 }}
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  {{- if and (eq .Values.backend.service.type "ClusterIP") .Values.backend.service.clusterIP }}
  clusterIP: {{ .Values.backend.service.clusterIP }}
  {{- end }}
  ports:
  - name: backend
    port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.port }}
    protocol: TCP
  selector:
    {{- include "subconverter.backend.selectorLabels" . | nindent 4 }}
{{- end }}

---
# Frontend Service
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "subconverter.frontend.fullname" . }}
  labels:
    {{- include "subconverter.frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    {{- include "subconverter.frontend.selectorLabels" . | nindent 4 }}
{{- end }}
