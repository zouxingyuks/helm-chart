# 示例配置: 禁用前端容器
# 此配置仅部署后端服务,不包含前端 Web 界面

# 后端配置
image:
  repository: asdlokj1qpi23/subconverter
  tag: "0.9.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# 禁用前端容器
frontend:
  enabled: false

# Service 配置
service:
  type: ClusterIP
  port: 25500  # 后端 API 端口

# Ingress 配置 (可选)
ingress:
  enabled: false
  className: "nginx"
  hostname: subconverter.example.com
  path: /
  pathType: Prefix
  tls: []

# 资源配置
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
