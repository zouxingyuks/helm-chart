apiVersion: v1
kind: Service
metadata:
  name: {{ include "deeplx.fullname" . }}
  namespace: {{ include "deeplx.namespace" . | quote }}
  labels:
    {{- include "deeplx.labels" . | nindent 4 }}
  {{- if or .Values.service.annotations .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.merge" (dict "values" (list .Values.service.annotations .Values.commonAnnotations) "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "deeplx.selectorLabels" . | nindent 4 }}
