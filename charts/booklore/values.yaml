# Default values for booklore
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# 全局配置
global:
  # 镜像拉取密钥
  imagePullSecrets: []

replicaCount: 1

image:
  # 镜像仓库
  repository: ghcr.io/booklore-app/booklore
  # 镜像拉取策略
  pullPolicy: IfNotPresent
  # 镜像标签 (默认使用 appVersion)
  tag: ""
  # 镜像拉取密钥
  pullSecrets: []

# 名称覆盖配置
nameOverride: ""
fullnameOverride: ""

# ServiceAccount 配置
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod 注解
podAnnotations: {}

# Pod 安全上下文
# BookLore 容器使用 su-exec 切换用户
# 不设置 fsGroup,避免 "setgroups(0): Operation not permitted" 错误
podSecurityContext: {}

# 容器安全上下文
# 允许权限提升,因为容器内使用 su-exec 切换用户
securityContext:
  allowPrivilegeEscalation: true

# Service 配置
service:
  type: ClusterIP
  port: 6060
  annotations: {}
  clusterIP: ""

# 容器配置
container:
  # 容器端口（默认使用 service.port）
  port: 6060
  # 容器内路径配置
  paths:
    data: /app/data       # 应用数据目录
    books: /books         # 书籍存储目录
    bookdrop: /bookdrop   # BookDrop 自动导入目录
    tmp: /tmp            # 临时目录

# Ingress 配置
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hostname: "booklore.example.com"
  path: /
  pathType: Prefix
  tls: {}
    # enabled: false
    # secretName: ""

# 资源配置
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# 自动扩缩容配置
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod 中断预算
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# 节点选择器
nodeSelector: {}

# 容忍度
tolerations: []

# 亲和性配置
affinity: {}

# 持久化存储配置
persistence:
  # 应用数据存储
  data:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}

  # 书籍文件存储
  books:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}

  # BookDrop 自动导入目录
  bookdrop:
    enabled: false
    existingClaim: ""
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}

# MariaDB 配置 (内置数据库)
mariadb:
  enabled: true

  # MariaDB 服务名称（用于内部连接）
  serviceName: "mariadb"
  # MariaDB 端口
  port: 3306

  # MariaDB 认证配置
  auth:
    rootPassword: ""  # 必需,安装时提供
    database: "booklore"
    username: "booklore"
    password: ""  # 必需,安装时提供
    existingSecret: ""

  # 持久化配置
  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: 8Gi
      accessModes:
        - ReadWriteOnce

# 外部数据库配置
externalDatabase:
  host: ""
  port: 3306
  user: "booklore"
  password: ""
  database: "booklore"
  existingSecret: ""

# 环境变量配置
env:
  # 应用配置
  BOOKLORE_PORT: "6060"
  APP_USER_ID: "1000"
  APP_GROUP_ID: "1000"
  TZ: "Etc/UTC"

  # 数据库配置 (自动生成,通常不需要手动设置)
  DATABASE_URL: ""
  DB_USER: ""
  DB_PASSWORD: ""

# 额外的环境变量
extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"
  # Spring Boot 数据源配置 (如果遇到数据库认证问题,取消下面的注释)
  # - name: SPRING_DATASOURCE_USERNAME
  #   value: "booklore"  # 应该与 mariadb.auth.username 一致
  # - name: SPRING_DATASOURCE_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: booklore-mariadb  # 将 "booklore" 替换为实际的 release 名称
  #       key: mariadb-password

# 额外的环境变量从 Secret/ConfigMap 注入
extraEnvFrom: []

# 健康检查配置
healthCheck:
  enabled: true
  path: /api/v1/healthcheck
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 5

# 额外的 Volume
extraVolumes: []

# 额外的 Volume 挂载
extraVolumeMounts: []
