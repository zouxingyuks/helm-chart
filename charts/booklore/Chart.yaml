apiVersion: v2
name: booklore
description: A Helm chart for BookLore - Self-hosted digital library with smart shelves, auto metadata, and OPDS support

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.0.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.17.0"

keywords:
  - booklore
  - library
  - ebooks
  - opds
  - digital-library
  - calibre

home: https://booklore.org
sources:
  - https://github.com/booklore-app/booklore
  - https://github.com/booklore-app/booklore-docs

maintainers:
  - name: BookLore Community
    url: https://github.com/booklore-app

annotations:
  artifacthub.io/category: "database"
  artifacthub.io/license: "GPL-3.0"
  artifacthub.io/links: |
    - name: Documentation
      url: https://booklore.org/docs
    - name: Support
      url: https://github.com/booklore-app/booklore/discussions
    - name: Source Code
      url: https://github.com/booklore-app/booklore
    - name: Changelog
      url: https://github.com/zouxingyuks/helm-chart/blob/main/charts/booklore/CHANGELOG.md
  artifacthub.io/images: |
    - name: booklore
      image: ghcr.io/booklore-app/booklore:1.17.0
  artifacthub.io/keywords: |
    - digital library
    - ebooks
    - opds
    - calibre alternative
    - self-hosted
    - book management
    - kobo sync
    - koreader sync
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/kubernetesVersion: ">=1.20.0-0"
  artifacthub.io/signKey: |
    fingerprint: <YOUR_FINGERPRINT>
    url: https://github.com/zouxingyuks/helm-chart

dependencies:
  - name: common
    repository: https://charts.bitnami.com/bitnami
    tags:
      - bitnami-common
    version: ~2.31.0
  - name: mariadb
    condition: mariadb.enabled
    alias: mariadb
    repository: "https://charts.bitnami.com/bitnami"
    version: ~23.2.0
