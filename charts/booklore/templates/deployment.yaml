{{- if .Values.mariadb.enabled }}
{{- if not .Values.mariadb.auth.existingSecret }}
{{- if not .Values.mariadb.auth.password }}
{{- fail "mariadb.auth.password is required when mariadb.enabled is true. Please provide it using --set mariadb.auth.password=<your-password>" }}
{{- end }}
{{- if not .Values.mariadb.auth.rootPassword }}
{{- fail "mariadb.auth.rootPassword is required when mariadb.enabled is true. Please provide it using --set mariadb.auth.rootPassword=<your-root-password>" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booklore.fullname" . }}
  labels:
    {{- include "booklore.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "booklore.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "booklore.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "booklore.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.container.port | default .Values.service.port }}
          protocol: TCP
        env:
        # 应用配置
        - name: BOOKLORE_PORT
          value: {{ .Values.env.BOOKLORE_PORT | quote }}
        - name: APP_USER_ID
          value: {{ .Values.env.APP_USER_ID | quote }}
        - name: APP_GROUP_ID
          value: {{ .Values.env.APP_GROUP_ID | quote }}
        - name: TZ
          value: {{ .Values.env.TZ | quote }}

        # 数据库配置
        {{- if .Values.mariadb.enabled }}
        # 使用内置 MariaDB
        - name: DATABASE_URL
          value: {{ printf "jdbc:mariadb://%s:%d/%s" (include "booklore.mariadb.host" .) (int .Values.mariadb.port) .Values.mariadb.auth.database }}
        - name: DB_USER
          value: {{ .Values.mariadb.auth.username | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "booklore.mariadb.secretName" . }}
              key: {{ include "booklore.mariadb.secretKey" . }}
        {{- else if .Values.externalDatabase.host }}
        # 使用外部数据库
        - name: DATABASE_URL
          value: {{ printf "jdbc:mariadb://%s:%d/%s" .Values.externalDatabase.host (int .Values.externalDatabase.port) .Values.externalDatabase.database }}
        - name: DB_USER
          value: {{ .Values.externalDatabase.user | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "booklore.externalDatabase.secretName" . }}
              key: {{ include "booklore.externalDatabase.secretKey" . }}
        {{- end }}

        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        {{- with .Values.extraEnvFrom }}
        envFrom:
          {{- toYaml . | nindent 8 }}
        {{- end }}

        # 健康检查
        {{- if .Values.healthCheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
          successThreshold: {{ .Values.healthCheck.successThreshold }}
          failureThreshold: {{ .Values.healthCheck.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
          successThreshold: {{ .Values.healthCheck.successThreshold }}
          failureThreshold: {{ .Values.healthCheck.failureThreshold }}
        {{- end }}

        resources:
          {{- toYaml .Values.resources | nindent 12 }}

        # Volume 挂载
        volumeMounts:
        # 应用数据
        - name: data
          mountPath: {{ .Values.container.paths.data }}
        # 书籍存储
        - name: books
          mountPath: {{ .Values.container.paths.books }}
        # BookDrop 导入目录
        {{- if .Values.persistence.bookdrop.enabled }}
        - name: bookdrop
          mountPath: {{ .Values.container.paths.bookdrop }}
        {{- end }}
        # 临时目录 (可选,用于只读文件系统)
        - name: tmp
          mountPath: {{ .Values.container.paths.tmp }}

        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # Volumes
      volumes:
      # 应用数据
      - name: data
        {{- if .Values.persistence.data.enabled }}
        {{- if .Values.persistence.data.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.data.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "booklore.fullname" . }}-data
        {{- end }}
        {{- else }}
        emptyDir: {}
        {{- end }}

      # 书籍存储
      - name: books
        {{- if .Values.persistence.books.enabled }}
        {{- if .Values.persistence.books.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.books.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "booklore.fullname" . }}-books
        {{- end }}
        {{- else }}
        emptyDir: {}
        {{- end }}

      # BookDrop 导入目录
      {{- if .Values.persistence.bookdrop.enabled }}
      - name: bookdrop
        {{- if .Values.persistence.bookdrop.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.bookdrop.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "booklore.fullname" . }}-bookdrop
        {{- end }}
      {{- end }}

      # 临时目录
      - name: tmp
        emptyDir: {}

      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
