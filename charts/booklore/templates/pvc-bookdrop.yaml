{{- if and .Values.persistence.bookdrop.enabled (not .Values.persistence.bookdrop.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "booklore.fullname" . }}-bookdrop
  labels:
    {{- include "booklore.labels" . | nindent 4 }}
  {{- with .Values.persistence.bookdrop.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.bookdrop.accessModes | nindent 4 }}
  {{- if .Values.persistence.bookdrop.storageClass }}
  storageClassName: {{ .Values.persistence.bookdrop.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.bookdrop.size }}
{{- end }}
