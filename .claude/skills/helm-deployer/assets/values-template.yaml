# Helm Chart values.yaml 配置模板
# 此模板包含常用配置项，根据实际需求调整

# ============================================
# 全局配置
# ============================================
global:
  # 全局镜像仓库
  imageRegistry: "docker.io"

  # 全局 imagePullSecrets
  imagePullSecrets: []

  # 全局 StorageClass
  storageClass: "local-path"

  # 环境变量（所有容器）
  env: []
  # - name: ENV_VAR
  #   value: "value"

# ============================================
# 镜像配置
# ============================================
image:
  # 镜像仓库（包含 global.imageRegistry 时完整路径为: registry/repository:tag）
  repository: "myapp"
  # 镜像标签
  tag: "v1.0.0"
  # 拉取策略: Always, IfNotPresent, Never
  pullPolicy: IfNotPresent

# imagePullSecrets:
#   - name: regcred

# ============================================
# 副本和升级策略
# ============================================
replicaCount: 1

# 更新策略
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# ============================================
# Pod 配置
# ============================================

# Pod 注解
podAnnotations: {}

# Pod 标签
podLabels: {}

# Pod 安全上下文
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# 容器安全上下文
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# ============================================
# 资源配置
# ============================================
resources:
  limits:
    cpu: "1000m"
    memory: "1024Mi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# ============================================
# 自动扩缩容 (HPA)
# ============================================
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ============================================
# 服务配置
# ============================================
service:
  # 服务类型: ClusterIP, NodePort, LoadBalancer
  type: ClusterIP
  # 服务端口
  port: 80
  # 目标端口 (容器端口)
  targetPort: http
  # 容器端口名称
  containerPort: 8080
  # 协议
  protocol: TCP
  # 服务注解
  annotations: {}
  # 额外的服务
  additionalServices: []

# ============================================
# Ingress 配置
# ============================================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# ============================================
# 持久化存储配置
# ============================================
persistence:
  enabled: false

  # PVC 配置
  persistentVolumeClaim:
    # StorageClass (留空使用集群默认)
    storageClass: "local-path"
    # 访问模式: ReadWriteOnce, ReadOnlyMany, ReadWriteMany
    accessModes:
      - ReadWriteOnce
    # 存储大小
    size: 10Gi

  # 多存储卷配置示例
  # volumes:
  #   data:
  #     enabled: true
  #     mountPath: /data
  #     persistentVolumeClaim:
  #       storageClass: "local-path"
  #       accessModes: [ReadWriteOnce]
  #       size: 10Gi
  #   logs:
  #     enabled: true
  #     mountPath: /logs
  #     persistentVolumeClaim:
  #       storageClass: "local-path"
  #       accessModes: [ReadWriteOnce]
  #       size: 5Gi

# ============================================
# 环境变量配置
# ============================================
env: []
# - name: ENV_VAR
#   value: "value"
# - name: SECRET_VAR
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: secret-key

# 从 ConfigMap/Secret 加载环境变量
envFrom: []
# - configMapRef:
#     name: my-config
# - secretRef:
#     name: my-secret

# ============================================
# ConfigMap 和 Secret 配置
# ============================================
configMaps: {}
#   my-config:
#     data:
#       config.yaml: |
#         key: value

secrets: {}
#   my-secret:
#     data:
#       password: cGFzc3dvcmQ=

# ============================================
# 健康检查配置
# ============================================
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 30

# ============================================
# 生命周期钩子
# ============================================
lifecycle: {}
  # postStart:
  #   exec:
  #     command:
  #       - /bin/sh
  #       - -c
  #       - echo "Hello from postStart"
  # preStop:
  #   exec:
  #     command:
  #       - /bin/sh
  #       - -c
  #       - echo "Hello from preStop"

# ============================================
# 节点选择和亲和性
# ============================================
nodeSelector: {}

tolerations: []

affinity: {}
  # podAntiAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #             - key: app.kubernetes.io/name
  #               operator: In
  #               values:
  #                 - <chart-name>
  #         topologyKey: kubernetes.io/hostname

# ============================================
# ServiceAccount 配置
# ============================================
serviceAccount:
  # 是否创建 ServiceAccount
  create: true
  # ServiceAccount 名称
  name: ""
  # ServiceAccount 注解
  annotations: {}
  # 自动挂载 ServiceAccount token
  automountToken: true

# ============================================
# RBAC 配置
# ============================================
rbac:
  # 是否创建 RBAC 资源
  create: false
  # 角色规则
  rules: []

# ============================================
# Pod 中断预算 (PDB)
# ============================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ============================================
# 监控配置
# ============================================
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# Prometheus 规则
prometheusRule:
  enabled: false
  rules: []

# ============================================
# 日志配置
# ============================================
logging:
  # 日志级别
  level: "info"
  # 日志格式: json, text
  format: "json"

# ============================================
# 其他配置
# ============================================
# 额外的卷挂载
extraVolumeMounts: []

# 额外的卷
extraVolumes: []

# 初始化容器
initContainers: []

# 额外的容器
sidecars: []

# 主机别名
hostAliases: []

# DNS 配置
dnsPolicy: "ClusterFirst"
dnsConfig: {}
  # nameservers:
  #   - 8.8.8.8
  # searches:
  #   - my.dns.search.suffix
  # options:
  #   - name: ndots
  #     value: "2"

# 时区
timezone: "UTC"

# ============================================
# 开发/测试环境特殊配置
# ============================================
# 开发模式
development: false

# 调试模式
debug: false

# ============================================
# 高可用配置
# ============================================
# 反亲和性配置（多副本分布在不同节点）
podAntiAffinity:
  hard: false
  soft: false

# ============================================
# 安全配置
# ============================================
# 网络策略
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

# Pod 安全策略 (PodSecurityPolicy - 已废弃，使用 Pod Security Standards)
podSecurity:
  # Kubernetes Pod Security Standards
  # - privileged: 不受限制
  # - baseline: 最小限制策略
  # - restricted: 严格受限策略
  standard: "baseline"

# ============================================
# 资源配额
# ============================================
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    persistentvolumeclaims: "4"

# LimitRange
limitRange:
  enabled: false
  defaults:
    min:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "2000m"
      memory: "2048Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
